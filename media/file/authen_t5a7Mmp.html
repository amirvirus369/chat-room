<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | ورود</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        vazir: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#090d16',
                        cardBg: 'rgba(17, 24, 39, 0.7)',
                        borderGlass: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .glass-input {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(30, 41, 59, 0.7);
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
        }

        /* Background Animated Glow Blobs */
        .glow-blob-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
            z-index: -1;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }

        .glow-blob-2 {
            position: absolute;
            bottom: -15%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0) 70%);
            z-index: -1;
            animation: floatBlob 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatBlob {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Background Animated Glows -->
    <div class="glow-blob-1"></div>
    <div class="glow-blob-2"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto relative z-10">
        
        <!-- Logo / Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 shadow-lg shadow-purple-500/30 mb-3 text-white text-2xl font-bold">
                <i class="fa-solid fa-cube"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">چت روم</h1>
            <p class="text-sm text-slate-400 mt-1">ساخته شده توسط امیرمهدی</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            
            {% if p %}
            <div class="mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-center">
                <p class="text-xs text-red-400 font-medium">{{ p }}</p>
            </div>
            {% endif %}
            
            <!-- Tab Switcher (Register / Login) -->
            <div class="flex bg-slate-900/60 p-1.5 rounded-2xl mb-6 relative border border-white/5">
                <div id="tabIndicator" class="absolute top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl transition-all duration-300 shadow-md"></div>
                <button type="button" onclick="switchTab('register')" id="regTabBtn" class="flex-1 py-2.5 text-center text-sm font-semibold text-white relative z-10 transition-colors duration-200">ثبت‌نام</button>
                <button type="button" onclick="switchTab('login')" id="logTabBtn" class="flex-1 py-2.5 text-center text-sm font-semibold text-slate-400 relative z-10 transition-colors duration-200">ورود</button>
            </div>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-4 transition-all duration-300" action="{% url 'chat:reg' %}" method="post">
                {% csrf_token %}
                
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">نام و نام خانوادگی</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 pointer-events-none">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" name="name" id="regName" placeholder="مثال: علی رضایی" class="glass-input w-full rounded-xl py-3 pr-10 pl-4 text-sm text-white placeholder-slate-500 outline-none">
                    </div>
                </div>

                <!-- Username / Phone -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">شماره تلفن</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 pointer-events-none">
                            <i class="fa-solid fa-phone"></i>
                        </span>
                        <input type="text" name="user" id="regUsername" placeholder="09123456789" class="glass-input w-full rounded-xl py-3 pr-10 pl-4 text-sm text-white placeholder-slate-500 outline-none">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">رمز عبور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 pointer-events-none">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="pass1" id="regPassword" placeholder="••••••••" class="glass-input w-full rounded-xl py-3 pr-10 pl-10 text-sm text-white placeholder-slate-500 outline-none">
                        <button type="button" onclick="togglePassword('regPassword', 'toggleRegPassIcon')" class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 hover:text-white transition-colors">
                            <i id="toggleRegPassIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">تکرار رمز عبور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 pointer-events-none">
                            <i class="fa-solid fa-shield-check"></i>
                        </span>
                        <input type="password" name="pass2" id="regConfirmPassword" placeholder="••••••••" class="glass-input w-full rounded-xl py-3 pr-10 pl-10 text-sm text-white placeholder-slate-500 outline-none">
                        <button type="button" onclick="togglePassword('regConfirmPassword', 'toggleRegConfIcon')" class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 hover:text-white transition-colors">
                            <i id="toggleRegConfIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium rounded-xl shadow-lg shadow-purple-600/30 transition-all duration-300 transform active:scale-[0.98] text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <span>ایجاد حساب کاربری</span>
                    <i class="fa-solid fa-arrow-left text-xs mr-2"></i>
                </button>
            </form>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4 hidden transition-all duration-300" action="{% url 'chat:login' %}" method="post">
                {% csrf_token %}
                
                <!-- Phone -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">شماره تلفن</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 pointer-events-none">
                            <i class="fa-solid fa-phone"></i>
                        </span>
                        <input type="text" name="user" id="logUser" placeholder="09123456789" class="glass-input w-full rounded-xl py-3 pr-10 pl-4 text-sm text-white placeholder-slate-500 outline-none">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-medium text-slate-300">رمز عبور</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 pointer-events-none">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="pass" id="logPassword" placeholder="••••••••" class="glass-input w-full rounded-xl py-3 pr-10 pl-10 text-sm text-white placeholder-slate-500 outline-none">
                        <button type="button" onclick="togglePassword('logPassword', 'toggleLogPassIcon')" class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 hover:text-white transition-colors">
                            <i id="toggleLogPassIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full mt-4 py-3.5 px-4 bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium rounded-xl shadow-lg shadow-purple-600/30 transition-all duration-300 transform active:scale-[0.98] text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <span>ورود به حساب کاربری</span>
                    <i class="fa-solid fa-arrow-left text-xs mr-2"></i>
                </button>
            </form>

        </div>

        <!-- Footer Note -->
        <p class="text-center text-xs text-slate-500 mt-6">
            تمامی حقوق محفوظ است &copy; ۱۴۰۵
        </p>
    </div>

    <!-- JavaScript Interactions -->
    <script>
        // Tab Switcher Logic
        function switchTab(tab) {
            const regForm = document.getElementById('registerForm');
            const logForm = document.getElementById('loginForm');
            const regBtn = document.getElementById('regTabBtn');
            const logBtn = document.getElementById('logTabBtn');
            const indicator = document.getElementById('tabIndicator');

            if (tab === 'register') {
                indicator.style.transform = 'translateX(0)';
                regForm.classList.remove('hidden');
                logForm.classList.add('hidden');
                regBtn.classList.remove('text-slate-400');
                regBtn.classList.add('text-white');
                logBtn.classList.remove('text-white');
                logBtn.classList.add('text-slate-400');
            } else {
                indicator.style.transform = 'translateX(-100%)';
                logForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                logBtn.classList.remove('text-slate-400');
                logBtn.classList.add('text-white');
                regBtn.classList.remove('text-white');
                regBtn.classList.add('text-slate-400');
            }
        }

        // Toggle Password Visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
