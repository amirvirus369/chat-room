<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید کد ورود | ثبت‌نام</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        vazir: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#090d16',
                        cardBg: 'rgba(17, 24, 39, 0.7)',
                        borderGlass: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .glass-input {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(30, 41, 59, 0.7);
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
        }

        /* Background Animated Glow Blobs */
        .glow-blob-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
            z-index: -1;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }

        .glow-blob-2 {
            position: absolute;
            bottom: -15%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0) 70%);
            z-index: -1;
            animation: floatBlob 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatBlob {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Background Animated Glows -->
    <div class="glow-blob-1"></div>
    <div class="glow-blob-2"></div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto relative z-10">
        
        <!-- Logo / Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 shadow-lg shadow-purple-500/30 mb-3 text-white text-2xl font-bold">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">تایید کد پیامک شده</h1>
            <p class="text-sm text-slate-400 mt-1">کد ارسالی به شماره موبایل خود را وارد کنید</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            
            {% if p %}
            <div class="mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-center">
                <p class="text-xs text-red-400 font-medium">{{ p }}</p>
            </div>
            {% endif %}

            <!-- Verify Form -->
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">کد تایید</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 pointer-events-none">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="text" name="code" required placeholder="مثلا 1234" class="glass-input w-full rounded-xl py-3.5 pr-10 pl-4 text-center tracking-widest text-lg font-bold text-white placeholder-slate-500 outline-none">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium rounded-xl shadow-lg shadow-purple-600/30 transition-all duration-300 transform active:scale-[0.98] text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <span>بررسی و تایید نهایی</span>
                    <i class="fa-solid fa-arrow-left text-xs mr-2"></i>
                </button>
            </form>

        </div>

        <!-- Footer Note -->
        <p class="text-center text-xs text-slate-500 mt-6">
            تمامی حقوق محفوظ است &copy; ۱۴۰۵
        </p>
    </div>

</body>
</html>
